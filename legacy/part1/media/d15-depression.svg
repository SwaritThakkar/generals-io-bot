39.0 252.812 L 647.84 264.304 Z" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="276.0" width="34.0" height="34.0" rx="0" fill="#b8b8b4" stroke="#4a4a4a" stroke-width="1.0" /><path d="M 528.16 298.304 L 537.0 286.812 L 545.84 298.304 Z" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><rect x="554.0" y="276.0" width="34.0" height="34.0" rx="0" fill="#b8b8b4" stroke="#4a4a4a" stroke-width="1.0" /><path d="M 562.16 298.304 L 571.0 286.812 L 579.84 298.304 Z" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><rect x="588.0" y="276.0" width="34.0" height="34.0" rx="0" fill="#b8b8b4" stroke="#4a4a4a" stroke-width="1.0" /><path d="M 596.16 298.304 L 605.0 286.812 L 613.84 298.304 Z" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><rect x="622.0" y="276.0" width="34.0" height="34.0" rx="0" fill="#b8b8b4" stroke="#4a4a4a" stroke-width="1.0" /><path d="M 630.16 298.304 L 639.0 286.812 L 647.84 298.304 Z" fill="none" stroke="#5a5a5a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="537.0" cy="157.0" r="8.8" fill="#c0392b" stroke="none" stroke-width="1.0"/><path d="M 537.0 157.0 L 571.0 191.0 L 537.0 225.0 L 605.0 259.0 L 571.0 225.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><text x="520.0" y="334.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a corridor that dead-ends into mountains:</text><text x="520.0" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">every step in looks like progress</text><rect x="50.0" y="366.0" width="860.0" height="62.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="66.0" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The fix is one sentence: prefer to move to states not known to be inside a depression.</text><text x="66.0" y="412.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">It can waste hundreds of moves; the literature calls it scrubbing.</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure O</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The failure mode this paper is about.</text></svg>