<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><rect width="960" height="470" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">A heuristic depression</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a bowl in the landscape that traps a greedy agent</text><line x1="50.0" y1="300.0" x2="450.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="50.0" y1="130.0" x2="50.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="250.0" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">position</text><text x="18" y="215.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 18 215.0)">h  (lower = looks closer to goal)</text><polyline points="50.0,156.6 54.0,157.0 58.0,157.5 62.0,158.0 66.0,158.5 70.0,159.0 74.0,159.4 78.0,159.9 82.0,160.4 86.0,160.9 90.0,161.3 94.0,161.8 98.0,162.3 102.0,162.8 106.0,163.3 110.0,163.7 114.0,164.2 118.0,164.7 122.0,165.2 126.0,165.7 130.0,166.3 134.0,166.9 138.0,167.5 142.0,168.2 146.0,169.1 150.0,170.1 154.0,171.3 158.0,172.8 162.0,174.7 166.0,177.1 170.0,180.0 174.0,183.5 178.0,187.7 182.0,192.7 186.0,198.5 190.0,205.0 194.0,212.1 198.0,219.6 202.0,227.5 206.0,235.3 210.0,242.7 214.0,249.5 218.0,255.3 222.0,259.8 226.0,262.8 230.0,264.1 234.0,263.8 238.0,261.7 242.0,258.2 246.0,253.3 250.0,247.5 254.0,241.0 258.0,234.1 262.0,227.3 266.0,220.7 270.0,214.5 274.0,209.0 278.0,204.2 282.0,200.2 286.0,196.9 290.0,194.3 294.0,192.4 298.0,191.0 302.0