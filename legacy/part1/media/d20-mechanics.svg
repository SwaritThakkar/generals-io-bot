<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430"><rect width="940" height="430" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The game supplies both mechanics natively</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the metareasoning literature usually has to simulate these</text><text x="60.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2c5f8a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">1.  identity action</text><text x="60.0" y="146.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">action index 0 on every tile is PASS</text><rect x="60.0" y="162.0" width="38.0" height="38.0" rx="0" fill="#eef4f8" stroke="#2c5f8a" stroke-width="1.8" /><text x="79.0" y="186.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#2c5f8a" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">0</text><rect x="104.0" y="162.0" width="38.0" height="38.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="0.9" /><text x="123.0" y="186.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">1</text><rect x="148.0" y="162.0" width="38.0" height="38.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="0.9" /><text x="167.0" y="186.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">2</text><rect x="192.0" y="162.0" width="3