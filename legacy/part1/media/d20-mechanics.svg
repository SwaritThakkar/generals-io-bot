 Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">stand still and think - permitted by the rules</text><line x1="60.0" y1="250.0" x2="880.0" y2="250.0" stroke="#e0e0e0" stroke-width="1" stroke-linecap="round"/><text x="60.0" y="282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">2.  prefix commitment</text><text x="60.0" y="302.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">queue a path; the server plays one move per tick</text><rect x="60.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="80.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m1</text><rect x="106.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="126.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m2</text><rect x="152.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="172.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m3</text><rect x="198.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="218.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m4</text><rect x="244.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="264.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m5</text><rect x="290.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="310.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m6</text><rect x="336.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="356.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m7</text><rect x="382.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="402.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m8</text><rect x="428.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="448.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m9</text><rect x="474.0" y="318.0" width="40.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="494.0" y="338.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m10</text><text x="540.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">= 10 ticks owing the game nothing</text><text x="540.0" y="356.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">= 5 seconds of free computation</text><text x="24.0" y="414.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure T</text><text x="86.0" y="414.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Both decision points have a literal counterpart in the rules.</text></svg>