<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect width="760" height="500" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 8</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Prove safety, then stop defending</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">With no fog and deterministic rules, this question has a yes-or-no answer.</text><circle cx="380.0" cy="150.0" r="13.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="154.0" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">s</text><text x="402.0" y="154.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">my position</text><text x="60.0" y="154.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2c5f8a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">OR  (my move)</text><line x1="380.0" y1="163.0" x2="230.0" y2="217.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><rect x="217.0" y="217.0" width="26.0" height="26.0" rx="0" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.2" /><line x1="380.0" y1="163.0" x2="380.0" y2="217.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><rect x="367.0" y="217.0" width="26.0" height="26.0" rx="0" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.2" /><line x1="380.0" y1="163.0" x2="530.0" y2="217.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><rect x="517.0" y="217.0" width="26.0" height="26.0" rx="0" fill="#f0f0ee" stroke="#1a1a1a" stroke-width="1.2" /><text x="60.0" y="234.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">AND  (their reply)</text><path d="M 246.0 243 A 16 16 0 0 0 246.1 243" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="230.0" y1="243.0" x2="186.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="186.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 182.0 314 L 185.0 317.5 L 190.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="230.0" y1="243.0" x2="230.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="230.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 226.0 314 L 229.0 317.5 L 234.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="230.0" y1="243.0" x2="274.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="274.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 270.0 314 L 273.0 317.5 L 278.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="380.0" y1="243.0" x2="336.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="336.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 332.0 314 L 335.0 317.5 L 340.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="380.0" y1="243.0" x2="380.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="380.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><line x1="376.0" y1="310.0" x2="384.0" y2="318.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="376.0" y1="318.0" x2="384.0" y2="310.0" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><line x1="380.0" y1="243.0" x2="424.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="424.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 420.0 314 L 423.0 317.5 L 428.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="530.0" y1="243.0" x2="486.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="486.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 482.0 314 L 485.0 317.5 L 490.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="530.0" y1="243.0" x2="530.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="530.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 526.0 314 L 529.0 317.5 L 534.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="530.0" y1="243.0" x2="574.0" y2="304.0" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round"/><circle cx="574.0" cy="314.0" r="9.0" fill="#ffffff" stroke="#3a6b45" stroke-width="1.4"/><path d="M 570.0 314 L 573.0 317.5 L 578.5 310" fill="none" stroke="#3a6b45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="230.0" y="346.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a6b45" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">all replies survive</text><text x="230.0" y="361.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a6b45" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">→ this move is safe</text><text x="380.0" y="346.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">one reply captures</text><text x="380.0" y="361.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">→ this move is not safe</text><rect x="28.0" y="378.0" width="704.0" height="82.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="44.0" y="400.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A move is safe only if it survives EVERY reply. That is an AND node (AIMA 4.3).</text><text x="44.0" y="420.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a6b45" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">If some move is provably safe for k ticks: spend the whole budget on attack.</text><text x="44.0" y="440.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">If none is: override whatever the evaluation recommended. A proof beats an opinion.</text><text x="24.0" y="486.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 11</text><text x="86.0" y="486.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A small AND-OR search used as a safety gate, not as the main search.</text></svg>