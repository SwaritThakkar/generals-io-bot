ight="400" font-style="normal" letter-spacing="0">    a = 1.00</text><text x="594.0" y="214.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    b = -0.25</text><text x="594.0" y="238.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">sigma = 0.52</text><text x="594.0" y="262.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    r = 1.00</text><text x="594.0" y="308.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a6b45" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">tight enough to prune on</text><rect x="80.0" y="404.0" width="720.0" height="86.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="96.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">r = 1.00, sigma = 0.52. Tight enough that ProbCut would prune aggressively and safely.</text><text x="96.0" y="450.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">But read it both ways: with a material-only evaluation the extra ply barely moves the</text><text x="96.0" y="467.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">value. Good for pruning - and a sign the evaluation needs more than land and army.</text><text x="96.0" y="484.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Measured on our own simulator, not taken from the paper.</text><text x="24.0" y="512.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure Q</text><text x="86.0" y="512.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The week-two experiment, run early as a sanity check.</text></svg>