<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Sparse, terminal reward</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">nothing tells you whether move 137 was good</text><rect x="60.0" y="140.0" width="720.0" height="40.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="420.0" y="165.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">no signal for ~500 ticks</text><line x1="146.4" y1="140.0" x2="146.4" y2="180.0" stroke="#ccc" stroke-width="0.8" stroke-linecap="round"/><text x="146.4" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">?</text><line x1="261.6" y1="140.0" x2="261.6" y2="180.0" stroke="#ccc" stroke-width="0.8" stroke-linecap="round"/><text x="261.6" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">?</text><line x1="384.0" y1="140.0" x2="384.0" y2="180.0" stroke="#ccc" stroke-width="0.8" stroke-linecap="round"/><text x="384.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">?</text><line x1="506.4" y1="140.0" x2="506.4" y2="180.0" stroke="#ccc" stroke-width="0.8" stroke-linecap="round"/><text x="506.4" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">?</text><line x1="636.0" y1="140.0" x2="636.0" y2="180.0" stroke="#ccc" stroke-width="0.8" stroke-linecap="round"/><text x="636.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">?</text><rect x="780.0" y="102.0" width="8.0" height="78.0" rx="0" fill="#c0392b" stroke="none" stroke-width="1.0" /><text x="798.0" y="118.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">+1  win</text><text x="798.0" y="136.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">-1  loss</text><text x="60.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">each ? is a decision with no feedback</text><text x="60.0" y="224.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">the only ground truth arrives once, at the very end</text><text x="60.0" y="246.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">so the evaluation function is doing all the work in between</text><text x="24.0" y="316.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure G</text><text x="86.0" y="316.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Why designing the evaluation is the hard part.</text></svg>