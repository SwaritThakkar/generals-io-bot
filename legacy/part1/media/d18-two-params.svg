<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430"><rect width="940" height="430" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Two lines the paper leaves undefined</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">RTAA* does not say how to choose them</text><rect x="50.0" y="120.0" width="470.0" height="208.0" rx="0" fill="#fbfbf9" stroke="#4a4a4a" stroke-width="1" /><text x="64.0" y="140.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">while s_curr not in GOAL:</text><rect x="54.0" y="146.0" width="462.0" height="18.0" rx="0" fill="#fdf6e3" stroke="#8a6d10" stroke-width="1" /><text x="64.0" y="159.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">    lookahead  = any integer &gt; 0</text><text x="64.0" y="178.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    astar()                    # expand &lt;= lookahead states</text><text x="64.0" y="197.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    s_bar = state in OPEN with smallest f</text><text x="64.0" y="216.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text><text x="64.0" y="235.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    for each s in CLOSED:</text><text x="64.0" y="254.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">        h[s] = g[s_bar] + h[s_bar] - g[s]</text><text x="64.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text><rect x="54.0" y="279.0" width="462.0" height="18.0" rx="0" fill="#fdf6e3" stroke="#8a6d10" stroke-width="1" /><text x="64.0" y="292.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">    movements  = any integer &gt; 0</text><text x="64.0" y="311.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">    take that many steps toward s_bar</text><line x1="524.0" y1="152.0" x2="543.0" y2="152.0" stroke="#8a6d10" stroke-width="1.3" stroke-linecap="round"/><polygon points="550.0,152.0 543.6,154.9 543.6,149.1" fill="#8a6d10"/><text x="560.0" y="148.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a6d10" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">how much to think?</text><text x="560.0" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ metareasoning, decision 1</text><line x1="524.0" y1="285.0" x2="543.0" y2="285.0" stroke="#8a6d10" stroke-width="1.3" stroke-linecap="round"/><polygon points="550.0,285.0 543.6,287.9 543.6,282.1" fill="#8a6d10"/><text x="560.0" y="281.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8a6d10" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">how far to commit?</text><text x="560.0" y="301.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">→ metareasoning, decision 2</text><rect x="50.0" y="344.0" width="840.0" height="52.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="66.0" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The paper says, literally, ‘any integer greater than zero’ for both.</text><text x="66.0" y="387.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">That gap is where the next paper - and my own contribution - lives.</text><text x="24.0" y="416.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure R</text><text x="86.0" y="416.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The hinge between the published algorithms and this project.</text></svg>