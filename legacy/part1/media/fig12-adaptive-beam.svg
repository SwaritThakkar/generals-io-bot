idth="0.4" /><rect x="482.7" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="492.3" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="501.9" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="511.5" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="521.2" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="530.8" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="540.4" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="550.0" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="559.6" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="569.2" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="578.8" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="588.5" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="598.1" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="607.7" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="617.3" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="626.9" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="636.5" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="646.2" y="282.0" width="7.6" height="6.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-wid