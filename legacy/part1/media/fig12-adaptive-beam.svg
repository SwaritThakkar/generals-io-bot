<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect width="760" height="500" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 9</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Adaptive beam width from the score distribution</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Beam search keeps the best k. We can read k off the data instead of guessing.</text><line x1="60.0" y1="288.0" x2="320.0" y2="288.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="60.0" y1="138.0" x2="60.0" y2="288.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="190.0" y="318.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">moves, best first</text><text x="30" y="213.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 30 213.0)">1-ply score</text><rect x="65.0" y="150.0" width="7.6" height="138.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="74.6" y="150.0" width="7.6" height="138.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="84.2" y="172.0" width="7.6" height="116.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="93.8" y="172.0" width="7.6" height="116.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.4" /><rect x="103.5" y="172.0" width="7.6" height="116.0" rx="0" fill="#e8b4ae" stroke="#4a4a4