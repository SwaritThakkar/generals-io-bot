<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 2</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Speculative pre-computation</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Production is deterministic, so most of the next board is already known.</text><rect x="60.0" y="140.0" width="150.0" height="34.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="135.0" y="162.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">tick t</text><text x="135.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">500 ms</text><rect x="230.0" y="140.0" width="150.0" height="34.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="305.0" y="162.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">tick t+1</text><text x="305.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">500 ms</text><rect x="400.0" y="140.0" width="150.0" height="34.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="475.0" y="162.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">tick t+2</text><text x="475.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">500 ms</text><text x="28.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">now:</text><rect x="60.0" y="194.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="82.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="106.0" y="194.0" width="104.0" height="22.0" rx="0" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" /><text x="158.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">idle</text><rect x="230.0" y="194.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="252.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="276.0" y="194.0" width="104.0" height="22.0" rx="0" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" /><text x="328.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">idle</text><rect x="400.0" y="194.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="422.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="446.0" y="194.0" width="104.0" height="22.0" rx="0" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" /><text x="498.0" y="209.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#aaaaaa" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">idle</text><text x="28.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">with pre-roll:</text><rect x="60.0" y="258.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="82.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="106.0" y="258.0" width="104.0" height="22.0" rx="0" fill="#e8f0e8" stroke="#3a6b45" stroke-width="1" /><text x="158.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#3a6b45" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">search t+1</text><line x1="202.0" y1="286.0" x2="231.3" y2="296.3" stroke="#3a6b45" stroke-width="1.1" stroke-linecap="round"/><polygon points="236.0,298.0 231.0,298.4 232.4,294.6" fill="#3a6b45"/><rect x="230.0" y="258.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="252.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="276.0" y="258.0" width="104.0" height="22.0" rx="0" fill="#e8f0e8" stroke="#3a6b45" stroke-width="1" /><text x="328.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#3a6b45" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">search t+2</text><line x1="372.0" y1="286.0" x2="401.3" y2="296.3" stroke="#3a6b45" stroke-width="1.1" stroke-linecap="round"/><polygon points="406.0,298.0 401.0,298.4 402.4,294.6" fill="#3a6b45"/><rect x="400.0" y="258.0" width="44.0" height="22.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="422.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">think</text><rect x="446.0" y="258.0" width="104.0" height="22.0" rx="0" fill="#e8f0e8" stroke="#3a6b45" stroke-width="1" /><text x="498.0" y="273.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#3a6b45" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">search t+3</text><rect x="28.0" y="350.0" width="704.0" height="76.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="44.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The board at t+1 equals the board at t plus deterministic production,</text><text x="44.0" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">minus at most two moves - each perturbing a handful of tiles out of 529.</text><text x="44.0" y="412.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a6b45" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">So the search started at t is still almost entirely valid at t+1. Patch, don't restart.</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 5</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Only possible because the game is deterministic and fully observable.</text></svg>