<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460"><rect width="880" height="460" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Anytime: an answer at every moment</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ARA* tightens ε while time remains</text><line x1="70.0" y1="330.0" x2="770.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="70.0" y1="120.0" x2="70.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="420.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">time (ms)</text><text x="38" y="225.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 38 225.0)">solution cost</text><line x1="70.0" y1="289.6" x2="770.0" y2="289.6" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 4"/><text x="766.0" y="281.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">optimal</text><circle cx="70.0" cy="152.3" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.0"/><text x="77.0" y="143.3" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8a6d10" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ε=3</text><line x1="70.0" y1="152.3" x2="168.0" y2="152.3" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="168.0" y1="152.3" x2="168.0" y2="216.9" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><circle cx="168.0" cy="216.9" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.0"/><text x="175.0" y="207.9" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8a6d10" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ε=2</text><line x1="168.0" y1="216.9" x2="280.0" y2="216.9" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="280.0" y1="216.9" x2="280.0" y2="249.2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><circle cx="280.0" cy="249.2" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.0"/><text x="287.0" y="240.2" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8a6d10" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ε=1.5</text><line x1="280.0" y1="249.2" x2="434.0" y2="249.2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="434.0" y1="249.2" x2="434.0" y2="273.5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><circle cx="434.0" cy="273.5" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.0"/><text x="441.0" y="264.5" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8a6d10" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ε=1.2</text><line x1="434.0" y1="273.5" x2="644.0" y2="273.5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="644.0" y1="273.5" x2="644.0" y2="289.6" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><circle cx="644.0" cy="289.6" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.0"/><text x="651.0" y="280.6" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#8a6d10" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ε=1</text><line x1="644.0" y1="289.6" x2="770.0" y2="289.6" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/><line x1="630.0" y1="110.0" x2="630.0" y2="338.0" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text x="624.0" y="104.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="0">deadline</text><rect x="70.0" y="352.0" width="740.0" height="62.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="86.0" y="374.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">At the deadline we are holding an answer with a known bound.</text><text x="86.0" y="396.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Plain A* would still be returning nothing at that line.</text><text x="24.0" y="444.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure K</text><text x="86.0" y="444.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Interruptible, with a guarantee at every step.</text></svg>