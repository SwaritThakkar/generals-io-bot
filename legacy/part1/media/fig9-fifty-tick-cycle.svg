<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 6</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The value of a tile depends on where you are in the 50-tick cycle</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Every owned tile pays +1 army on a global schedule, every 50 ticks.</text><line x1="66.0" y1="290.0" x2="686.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="66.0" y1="140.0" x2="66.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="376.0" y="320.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">tick within the cycle  (t mod 50)</text><text x="36" y="215.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 36 215.0)">value of capturing a tile now</text><polyline points="66.0,267.0 72.2,266.8 78.4,266.6 84.6,266.4 90.8,266.2 97.0,266.0 103.2,265.8 109.4,265.6 115.6,265.4 121.8,265.1 128.0,264.9 134.2,264.7 140.4,264.4 146.6,264.2 152.8,264.0 159.0,263.7 165.2,263.5 171.4,263.2 177.6,262.9 183.8,262.7 190.0,262.4 196.2,262.1 202.4,261.8 208.6,261.5 214.8,261.2 221.0,260.9 227.2,260.6 233.4,260.3 239.6,260.0 245.8,259.7 252.0,259.3 258.2,259.0 264.4,258.6 270.6,258.3 276.8,257.9 283.0,257.5 289.2,257.1 295.4,256.7 301.6,256.3 307.8,255.9 314.0,255.5 320.2,255.1 326.4,254.6 332.6,254.2 338.8,253.7 345.0,253.2 351.2,252.7 357.4,252.2 363.6,251.7 369.8,251.1 376.0,250.6 382.2,250.0 388.4,249.4 394.6,248.8 400.8,248.2 407.0,247.5 413.2,246.9 419.4,246.2 425.6,245.5 431.8,244.8 438.0,244.0 444.2,243.2 450.4,242.4 456.6,241.6 462.8,240.7 469.0,239.8 475.2,238.9 481.4,237.9 487.6,236.9 493.8,235.9 500.0,234.8 506.2,233.7 512.4,232.5 518.6,231.3 524.8,230.0 531.0,228.7 537.2,227.3 543.4,225.8 549.6,224.3 555.8,222.7 562.0,221.0 568.2,219.2 574.4,217.4 580.6,215.4 586.8,213.3 593.0,211.1 599.2,208.8 605.4,206.4 611.6,203.8 617.8,201.0 624.0,198.0 630.2,194.8 636.4,191.4 642.6,187.8 648.8,183.8 655.0,179.6 661.2,175.0 667.4,170.0 673.6,164.5 679.8,158.6 686.0,152.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><line x1="686.0" y1="140.0" x2="686.0" y2="290.0" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round"/><text x="680.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="0">land tick: every owned tile pays +1</text><text x="66.0" y="305.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">0</text><text x="376.0" y="305.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">25</text><text x="673.6" y="305.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">49</text><text x="76.0" y="276.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a tile taken here waits 49 ticks to pay</text><text x="676.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">a tile taken here pays next tick</text><rect x="28.0" y="332.0" width="704.0" height="96.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="44.0" y="354.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Predicted behaviour: expand hard just before the tick, consolidate just after.</text><text x="44.0" y="376.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Strong human players do this by instinct. We would do it because the evaluation</text><text x="44.0" y="393.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">says so - the weight is derived, not tuned, and it costs nothing to compute.</text><text x="44.0" y="416.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Test: add the term, run 200 games, and watch the viewer for a visible rhythm.</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 9</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A time-varying weight that falls out of the production rules.</text></svg>