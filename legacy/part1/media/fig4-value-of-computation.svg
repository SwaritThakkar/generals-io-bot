<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 1</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Value of computation is measurable, not estimated</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Measured over a full game: how many legal moves tie at the best 1-ply score.</text><line x1="66.0" y1="310.0" x2="446.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="66.0" y1="130.0" x2="66.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="256.0" y="340.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">% of moves tied at the best score</text><text x="36" y="220.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 36 220.0)">ticks</text><rect x="70.0" y="155.4" width="34.2" height="154.6" rx="0" fill="#3a6b45" stroke="#4a4a4a" stroke-width="0.6" /><text x="87.1" y="150.4" font-family="Menlo, Consolas, monospace" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">23</text><rect x="107.2" y="289.8" width="34.2" height="20.2" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="0.6" /><text x="124.3" y="284.8" font-family="Menlo, Consolas, monospace" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">3</text><rect x="144.4" y="310.0" width="34.2" height="0.0" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="0.6" /><rect x="181.6" y="310.0" width="34.2" height="0.0" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="0.6" /><rect x="218.8" y="310.0" width="34.2" height="0.0" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="0.6" /><rect x="256.0" y="310.0" width="34.2" height="0.0" rx="0" fill="#8a6d10" stroke="#4a4a4a" stroke-width="0.6" /><rect x="293.2" y="310.0" width="34.2" height="0.0" rx="0" fill="#8a6d10" stroke="#4a4a4a" stroke-width="0.6" /><rect x="330.4" y="249.5" width="34.2" height="60.5" rx="0" fill="#8a6d10" stroke="#4a4a4a" stroke-width="0.6" /><text x="347.5" y="244.5" font-family="Menlo, Consolas, monospace" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">9</text><rect x="367.6" y="310.0" width="34.2" height="0.0" rx="0" fill="#8a6d10" stroke="#4a4a4a" stroke-width="0.6" /><rect x="404.8" y="142.0" width="34.2" height="168.0" rx="0" fill="#8a6d10" stroke="#4a4a4a" stroke-width="0.6" /><text x="421.9" y="137.0" font-family="Menlo, Consolas, monospace" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">25</text><text x="70.0" y="325.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">0%</text><text x="256.0" y="325.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">50%</text><text x="442.0" y="325.0" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">100%</text><text x="66.0" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The distribution is bimodal</text><rect x="480.0" y="130.0" width="250.0" height="84.0" rx="0" fill="#eef6ef" stroke="#3a6b45" stroke-width="1.2" /><text x="494.0" y="154.0" font-family="Menlo, Consolas, monospace" font-size="17" fill="#3a6b45" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">38% of ticks</text><text x="494.0" y="175.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">almost nothing ties.</text><text x="494.0" y="193.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1-ply already decided it -</text><text x="494.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">play now, ~3 ms total.</text><rect x="480.0" y="226.0" width="250.0" height="84.0" rx="0" fill="#fdf6e3" stroke="#8a6d10" stroke-width="1.2" /><text x="494.0" y="250.0" font-family="Menlo, Consolas, monospace" font-size="17" fill="#8a6d10" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">57% of ticks</text><text x="494.0" y="271.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">most moves tie. 1-ply</text><text x="494.0" y="286.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">cannot separate them -</text><text x="494.0" y="304.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">spend the budget here.</text><rect x="28.0" y="348.0" width="704.0" height="84.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="44.0" y="370.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Because the distribution is bimodal, a single threshold separates the two cases cleanly.</text><text x="44.0" y="391.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">And the signal is not the gap to the second-best move - ties are everywhere, so that gap</text><text x="44.0" y="408.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">is almost always zero. It is how many moves are indistinguishable.</text><text x="44.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Cost side: one tick of tempo ≈ ρ army, ρ = producers/2 + land/50, fixed by the rules.</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 4</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Deciding whether a tick deserves a search, from measured data.</text></svg>