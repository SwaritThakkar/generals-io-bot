<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 3</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The move queue is a compute budget</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Every queued move is a tick during which the agent owes the game nothing.</text><rect x="60.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="83.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m1</text><rect x="112.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="135.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m2</text><rect x="164.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="187.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m3</text><rect x="216.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="239.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m4</text><rect x="268.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="291.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m5</text><rect x="320.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="343.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m6</text><rect x="372.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="395.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m7</text><rect x="424.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="447.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m8</text><rect x="476.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="499.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m9</text><rect x="528.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="551.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m10</text><rect x="580.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="603.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m11</text><rect x="632.0" y="132.0" width="46.0" height="30.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="0.9" /><text x="655.0" y="152.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">m12</text><path d="M 68 122 L 60 122 L 60 122 L 68 122" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="60.0" y1="118.0" x2="678.0" y2="118.0" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/><line x1="60.0" y1="112.0" x2="60.0" y2="124.0" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/><line x1="678.0" y1="112.0" x2="678.0" y2="124.0" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/><text x="369.0" y="108.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">one queued path, 12 moves</text><rect x="60.0" y="186.0" width="618.0" height="34.0" rx="0" fill="#e8f0e8" stroke="#3a6b45" stroke-width="1.2" /><text x="369.0" y="208.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#3a6b45" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">12 × 0.5 s  =  6 seconds of uninterrupted computation</text><text x="28.0" y="262.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The commit decision becomes a trade, not a confidence test:</text><rect x="60.0" y="278.0" width="300.0" height="74.0" rx="0" fill="#e8f0e8" stroke="#3a6b45" stroke-width="1" /><text x="76.0" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">path inside our own territory,</text><text x="76.0" y="317.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">no enemy stack in reach</text><text x="76.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a6b45" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">→ queue it all, buy the time</text><rect x="384.0" y="278.0" width="300.0" height="74.0" rx="0" fill="#fdf1f0" stroke="#c0392b" stroke-width="1" /><text x="400.0" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">path approaching contact</text><text x="400.0" y="317.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">- the position may change</text><text x="400.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">→ commit one move, re-plan</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 6</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Prefix commitment, with a mechanic the game supplies natively.</text></svg>