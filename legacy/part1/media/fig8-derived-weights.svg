<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 5</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Evaluation weights derived from the rules, not tuned</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Production is fixed by the rulebook, so the exchange rate is arithmetic.</text><rect x="60.0" y="128.0" width="300.0" height="92.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><circle cx="96.0" cy="162.0" r="13.0" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><text x="120.0" y="167.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">one castle</text><text x="76.0" y="194.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">+1 army every 2 ticks</text><text x="76.0" y="212.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">= 0.50 army / tick</text><rect x="400.0" y="128.0" width="300.0" height="92.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><rect x="418.0" y="154.0" width="12.0" height="12.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.6" /><rect x="433.0" y="154.0" width="12.0" height="12.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.6" /><rect x="448.0" y="154.0" width="12.0" height="12.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.6" /><rect x="463.0" y="154.0" width="12.0" height="12.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.6" /><rect x="478.0" y="154.0" width="12.0" height="12.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="0.6" /><text x="504.0" y="167.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">one land tile</text><text x="416.0" y="194.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">+1 army every 50 ticks</text><text x="416.0" y="212.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#2c5f8a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">= 0.02 army / tick</text><text x="380.0" y="254.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">one castle  =  25 land tiles of production</text><line x1="60.0" y1="278.0" x2="700.0" y2="278.0" stroke="#dddddd" stroke-width="1" stroke-linecap="round"/><text x="60.0" y="304.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Now price them. A tile costs 1 army permanently (one unit stays behind).</text><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A neutral castle costs its garrison: 40-50.</text><text x="60.0" y="332.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">spend 45 army on:</text><rect x="60.0" y="338.0" width="234.0" height="24.0" rx="0" fill="#e8b4ae" stroke="#c0392b" stroke-width="1" /><text x="66.0" y="355.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">45 tiles → 0.90 army/tick</text><rect x="60.0" y="370.0" width="130.0" height="24.0" rx="0" fill="#aac4d8" stroke="#2c5f8a" stroke-width="1" /><text x="66.0" y="387.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1 castle → 0.50 army/tick</text><text x="340.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">land wins by ~1.8×</text><text x="340.0" y="392.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">whenever that much free land is reachable</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 8</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A falsifiable claim about a game most people play by feel.</text></svg>