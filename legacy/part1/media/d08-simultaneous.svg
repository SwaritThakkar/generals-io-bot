<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580"><rect width="940" height="580" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Simultaneous moves</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">both players commit for the same tick without seeing the other</text><rect x="40.0" y="100.0" width="400.0" height="150.0" rx="3" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.2" /><text x="56.0" y="124.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">(a)  SEQUENTIAL - what minimax assumes</text><text x="56.0" y="150.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">I move</text><line x1="120.0" y1="146.0" x2="162.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/><polygon points="168.0,146.0 162.5,148.4 162.5,143.6" fill="#1a1a1a"/><text x="176.0" y="150.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">they SEE it</text><line x1="262.0" y1="146.0" x2="304.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/><polygon points="310.0,146.0 304.5,148.4 304.5,143.6" fill="#1a1a1a"/><text x="318.0" y="150.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">they reply</text><text x="56.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">This is false here.</text><text x="56.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Minimax quietly gives the second player</text><text x="56.0" y="224.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">information they do not actually have.</text><rect x="470.0" y="100.0" width="430.0" height="150.0" rx="3" fill="#eef4f8" stroke="#2c5f8a" stroke-width="1.2" /><text x="486.0" y="124.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2c5f8a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">(b)  SIMULTANEOUS - what happens</text><rect x="486.0" y="146.0" width="96.0" height="26.0" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="1" /><text x="534.0" y="164.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">face down</text><text x="592.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">my move</text><rect x="486.0" y="180.0" width="96.0" height="26.0" rx="0" fill="#dcdcd8" stroke="#4a4a4a" stroke-width="1" /><text x="534.0" y="198.0" font-family="Menlo, Consolas, monospace" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">face down</text><text x="592.0" y="198.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2c5f8a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">their move</text><line x1="700.0" y1="180.0" x2="741.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/><polygon points="748.0,180.0 741.6,182.9 741.6,177.1" fill="#1a1a1a"/><text x="756.0" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">revealed</text><text x="756.0" y="193.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">together</text><text x="300.0" y="286.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">so a node is a matrix game, not a max or a min</text><text x="204.0" y="362.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">my</text><text x="204.0" y="377.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">move</text><text x="362.0" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text><text x="362.0" y="312.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2c5f8a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">their move</text><rect x="300.0" y="322.0" width="62.0" height="62.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" /><text x="331.0" y="358.0" font-family="Menlo, Consolas, monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">+2</text><rect x="362.0" y="322.0" width="62.0" height="62.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" /><text x="393.0" y="358.0" font-family="Menlo, Consolas, monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">-1</text><rect x="300.0" y="384.0" width="62.0" height="62.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" /><text x="331.0" y="420.0" font-family="Menlo, Consolas, monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">-3</text><rect x="362.0" y="384.0" width="62.0" height="62.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" /><text x="393.0" y="420.0" font-family="Menlo, Consolas, monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">+1</text><text x="446.0" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">solved as a matrix game,</text><text x="446.0" y="401.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">not by taking a max</text><text x="24.0" y="556.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure H</text><text x="86.0" y="556.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The one piece of hidden information that remains.</text></svg>