<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Combat is subtraction</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the two stacks cancel one for one; the larger survives with the difference</text><text x="40.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">(a)  before</text><rect x="40.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="1.0" /><text x="77.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">10</text><rect x="120.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#aac4d8" stroke="#4a4a4a" stroke-width="1.0" /><text x="157.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">4</text><text x="330.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">(b)  the move</text><rect x="330.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="1.0" /><text x="367.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">10</text><rect x="438.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#aac4d8" stroke="#4a4a4a" stroke-width="1.0" /><text x="475.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">4</text><line x1="408.0" y1="157.0" x2="425.0" y2="157.0" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/><polygon points="434.0,157.0 425.8,160.7 425.8,153.3" fill="#1a1a1a"/><text x="421.0" y="112.0" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">9</text><text x="384.0" y="224.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">9 units leave, 1 stays behind</text><text x="620.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">(c)  after</text><rect x="620.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="1.0" /><text x="657.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">1</text><rect x="700.0" y="120.0" width="74.0" height="74.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="1.0" /><text x="737.0" y="168.8" font-family="Menlo, Consolas, monospace" font-size="29.6" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">5</text><line x1="280.0" y1="157.0" x2="313.0" y2="157.0" stroke="#bbb" stroke-width="1.4" stroke-linecap="round"/><polygon points="320.0,157.0 313.6,159.9 313.6,154.1" fill="#bbb"/><line x1="572.0" y1="157.0" x2="605.0" y2="157.0" stroke="#bbb" stroke-width="1.4" stroke-linecap="round"/><polygon points="612.0,157.0 605.6,159.9 605.6,154.1" fill="#bbb"/><text x="40.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">9 attackers meet 4 defenders  →  I take the tile with 5 left standing</text><text x="40.0" y="298.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">had they held 12, they would keep the tile with 3 left standing</text><text x="24.0" y="376.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure B</text><text x="86.0" y="376.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The whole combat rule.</text></svg>