<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><rect width="760" height="470" fill="#ffffff"/><text x="28.0" y="38.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#8a6d10" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Idea 4</text><text x="28.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Let the game phase emerge, don't hardcode it</text><text x="28.0" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Chess-style early/mid/end splits are arbitrary here. The signal defines them.</text><line x1="66.0" y1="304.0" x2="706.0" y2="304.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><line x1="66.0" y1="128.0" x2="66.0" y2="304.0" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/><text x="386.0" y="334.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">tick</text><text x="36" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 36 216.0)">% of moves tied at best</text><polyline points="66.0,128.0 76.8,128.0 87.7,172.0 98.5,128.0 109.4,172.0 120.2,128.0 131.1,172.0 141.9,128.0 152.8,172.0 163.6,288.0 174.5,172.0 185.3,128.0 196.2,172.0 207.0,128.0 217.9,172.0 228.7,128.0 239.6,172.0 250.4,128.0 261.3,172.0 272.1,299.1 282.9,274.7 293.8,128.0 304.6,286.4 315.5,128.0 326.3,128.0 337.2,286.4 348.0,128.0 358.9,290.5 369.7,128.0 380.6,302.3 391.4,302.0 402.3,128.0 413.1,302.9 424.0,128.0 434.8,132.3 445.7,302.7 456.5,128.0 467.4,128.0 478.2,301.4 489.1,302.5 499.9,129.8 510.7,302.1 521.6,128.0 532.4,302.0 543.3,303.0 554.1,303.0 565.0,303.0 575.8,301.1 586.7,128.0 597.5,303.4 608.4,128.0 619.2,303.3 630.1,128.0 640.9,301.7 651.8,302.5 662.6,302.5 673.5,303.3 684.3,303.3 695.2,128.0 706.0,302.4" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><rect x="66.0" y="128.0" width="271.2" height="176.0" rx="0" fill="#eef4f8" stroke="none" stroke-width="1.0" /><rect x="337.2" y="128.0" width="184.4" height="176.0" rx="0" fill="#fdf6e3" stroke="none" stroke-width="1.0" /><rect x="521.6" y="128.0" width="184.4" height="176.0" rx="0" fill="#eef6ef" stroke="none" stroke-width="1.0" /><polyline points="66.0,128.0 76.8,128.0 87.7,172.0 98.5,128.0 109.4,172.0 120.2,128.0 131.1,172.0 141.9,128.0 152.8,172.0 163.6,288.0 174.5,172.0 185.3,128.0 196.2,172.0 207.0,128.0 217.9,172.0 228.7,128.0 239.6,172.0 250.4,128.0 261.3,172.0 272.1,299.1 282.9,274.7 293.8,128.0 304.6,286.4 315.5,128.0 326.3,128.0 337.2,286.4 348.0,128.0 358.9,290.5 369.7,128.0 380.6,302.3 391.4,302.0 402.3,128.0 413.1,302.9 424.0,128.0 434.8,132.3 445.7,302.7 456.5,128.0 467.4,128.0 478.2,301.4 489.1,302.5 499.9,129.8 510.7,302.1 521.6,128.0 532.4,302.0 543.3,303.0 554.1,303.0 565.0,303.0 575.8,301.1 586.7,128.0 597.5,303.4 608.4,128.0 619.2,303.3 630.1,128.0 640.9,301.7 651.8,302.5 662.6,302.5 673.5,303.3 684.3,303.3 695.2,128.0 706.0,302.4" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><line x1="337.2" y1="128.0" x2="337.2" y2="304.0" stroke="#bbbbbb" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/><text x="201.6" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">opening</text><line x1="521.6" y1="128.0" x2="521.6" y2="304.0" stroke="#bbbbbb" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/><text x="429.4" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">contact</text><line x1="706.0" y1="128.0" x2="706.0" y2="304.0" stroke="#bbbbbb" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/><text x="613.8" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">conversion</text><rect x="28.0" y="344.0" width="704.0" height="88.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="44.0" y="366.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">The phases are visible in a statistic we compute anyway.</text><text x="44.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">No tick thresholds to tune, and the boundaries move with the game</text><text x="44.0" y="403.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">rather than sitting at a number someone guessed.</text><text x="44.0" y="423.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Strategy switching then falls out of budget allocation, not a separate mechanism.</text><text x="24.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure 7</text><text x="86.0" y="456.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Phase as a consequence of the metareasoning signal.</text></svg>