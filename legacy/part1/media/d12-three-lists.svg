<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">How ARA* reuses the previous pass</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">OPEN is exactly the set of locally inconsistent states</text><rect x="70.0" y="120.0" width="180.0" height="96.0" rx="3" fill="#eef4f8" stroke="#2c5f8a" stroke-width="1.4" /><text x="84.0" y="146.0" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2c5f8a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">OPEN</text><text x="84.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">inconsistent,</text><text x="84.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">may expand</text><rect x="360.0" y="120.0" width="180.0" height="96.0" rx="3" fill="#f0f0ee" stroke="#8a8a8a" stroke-width="1.4" /><text x="374.0" y="146.0" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">CLOSED</text><text x="374.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">expanded this pass,</text><text x="374.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">do not touch again</text><rect x="650.0" y="120.0" width="180.0" height="96.0" rx="3" fill="#fdf6e3" stroke="#8a6d10" stroke-width="1.4" /><text x="664.0" y="146.0" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8a6d10" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">INCONS</text><text x="664.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">became inconsistent</text><text x="664.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">after being closed</text><line x1="250.0" y1="150.0" x2="349.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><polygon points="356.0,150.0 349.6,152.9 349.6,147.1" fill="#1a1a1a"/><text x="303.0" y="142.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">expand</text><line x1="540.0" y1="170.0" x2="639.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><polygon points="646.0,170.0 639.6,172.9 639.6,167.1" fill="#1a1a1a"/><text x="593.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">g improves</text><text x="593.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">after closing</text><path d="M 740 216 L 740 268 L 160 268 L 160 222" fill="none" stroke="#8a6d10" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="160.0" y1="250.0" x2="160.0" y2="228.0" stroke="#8a6d10" stroke-width="2.2" stroke-linecap="round"/><polygon points="160.0,220.0 163.3,227.3 156.7,227.3" fill="#8a6d10"/><text x="450.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a6d10" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">at the end of a pass, INCONS is poured back into OPEN for the next ε</text><rect x="70.0" y="320.0" width="760.0" height="58.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1" /><text x="86.0" y="342.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">That single arrow is the reuse.</text><text x="86.0" y="364.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Without it, every new ε would restart the search from scratch.</text><text x="24.0" y="414.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure L</text><text x="86.0" y="414.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The mechanism that makes ARA* anytime rather than just repeated.</text></svg>