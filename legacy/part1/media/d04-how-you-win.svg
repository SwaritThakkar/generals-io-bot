<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350"><rect width="700" height="350" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">How you win</text><text x="30.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">move an army onto the enemy general and win the fight there</text><rect x="60.0" y="110.0" width="56.0" height="56.0" rx="0" fill="#e8b4ae" stroke="#4a4a4a" stroke-width="1.0" /><text x="88.0" y="147.0" font-family="Menlo, Consolas, monospace" font-size="22.400000000000002" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">9</text><rect x="119.0" y="110.0" width="56.0" height="56.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1.0" /><rect x="178.0" y="110.0" width="56.0" height="56.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1.0" /><rect x="237.0" y="110.0" width="56.0" height="56.0" rx="0" fill="#f0f0ee" stroke="#4a4a4a" stroke-width="1.0" /><rect x="296.0" y="110.0" width="56.0" height="56.0" rx="0" fill="#aac4d8" stroke="#4a4a4a" stroke-width="1.0" /><path d="M 312.8 132.96 L 312.8 122.88 L 319.296 127.92 L 324.0 118.064 L 328.704 127.92 L 335.2 122.88 L 335.2 132.96 Z" fill="#2c5f8a" stroke="none" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="324.0" y="157.0" font-family="Menlo, Consolas, monospace" font-size="19.040000000000003" fill="#1a1a1a" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">3</text><line x1="93.6" y1="138.0" x2="305.6" y2="138.0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/><polygon points="315.6,138.0 306.5,142.1 306.5,133.9" fill="#c0392b"/><text x="60.0" y="196.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">9 → 8 → 7 → 6 arrives, beats a garrison of 3</text><text x="60.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">no points system; no other victory condition</text><text x="24.0" y="326.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Figure D</text><text x="86.0" y="326.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The only terminal condition in the game.</text></svg>